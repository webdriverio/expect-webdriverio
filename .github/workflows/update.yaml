# this workflow merges requests from Dependabot if tests are passing
# ref https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
# and https://github.com/dependabot/fetch-metadata
name: Auto-merge

# `pull_request_target` means this uses code in the base branch, not the PR.
on: pull_request_target

# Dependabot PRs' tokens have read permissions by default and thus we must enable write permissions.
permissions:
    contents: write
    pull-requests: write

jobs:
    dependencies:
        runs-on: ubuntu-latest
        if: github.actor == 'dependabot[bot]'

        steps:
            - name: Fetch PR metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Check that the base branch requires the tests
              # Without required checks (e.g. the ruleset `main` is disabled), `gh pr merge --auto` merges at once,
              # before the checks of the PR: stop, and leave the PR to a person. Update the list when a job is renamed
              if: contains(steps.metadata.outputs.package-ecosystem, 'npm')
              env:
                  BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MUST_BE_REQUIRED: |-
                      linux (24.x)
                      playgrounds-tsc-and-lint
              run: |
                  required=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${BASE_BRANCH}" --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]')
                  list=$(paste -sd, - <<< "${required}")
                  echo "Required checks on ${BASE_BRANCH}: ${list:-none}"
                  missing=0
                  while IFS= read -r check; do
                      if ! grep -qxF -- "${check}" <<< "${required}"; then
                          echo "::error::${BASE_BRANCH} does not require the check '${check}' (is the ruleset disabled?): the PR is not merged automatically"
                          missing=1
                      fi
                  done <<< "${MUST_BE_REQUIRED}"
                  exit "${missing}"

            - name: Auto-merge dependabot PRs
              # Don't merge updates to GitHub Actions versions automatically.
              # (Some repos may wish to limit by version range (major/minor/patch), or scope (dep vs dev-dep), too.)
              if: contains(steps.metadata.outputs.package-ecosystem, 'npm')
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # The "auto" flag merges only when the required checks of `main` pass (the ruleset `main`), and GitHub waits
              # for them without a runner. Without an active ruleset with required checks, it merges at once
              run: gh pr merge --auto --squash "$PR_URL"
