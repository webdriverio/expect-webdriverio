name: Manual NPM Publish

# v8 alphas only, until the v8.0.0 release (#2246). v7.x releases come from the v7 branch.
on:
  workflow_dispatch:

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  authorize:
    name: Authorize Actor
    uses: ./.github/workflows/authorize-publisher.yml
    secrets:
      WDIO_BOT_GITHUB_TOKEN: ${{ secrets.WDIO_BOT_GITHUB_TOKEN }}
  release:
    needs: [authorize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check Push Access
        # npm publishes before the git push: stop now if the push token cannot bypass the rulesets of main
        run: |
          set -o pipefail
          api() { curl --fail-with-body --silent --show-error -H "Authorization: Bearer $PUSH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}$1"; }
          # Assignments, not `$(...)` inside `echo` or `for`, so that a failed API call stops the step
          repo=$(api "")
          echo "Write access: $(jq -r '.permissions.push // "not reported for this token"' <<< "$repo")"
          ids=$(api "/rules/branches/main" | jq -r '[.[].ruleset_id] | unique | .[]')
          for id in $ids; do
            ruleset=$(api "/rulesets/$id")
            name=$(jq -r '.name' <<< "$ruleset")
            bypass=$(jq -r '.current_user_can_bypass' <<< "$ruleset")
            echo "Ruleset '$name': current_user_can_bypass=$bypass"
            if [[ "$bypass" != "always" && "$bypass" != "exempt" ]]; then
              echo "::error::The push token cannot bypass the ruleset '$name' of main, so the release push would be rejected"
              exit 1
            fi
          done
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 'main'
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Git Setup
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Project
        run: pnpm run build
        env:
          NODE_ENV: production
      - name: Pick Version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # From a stable version (7.0.0) start 8.0.0-alpha.0, else bump the alpha
          if [[ "$CURRENT" == *-* ]]; then INCREMENT=""; else INCREMENT="major"; fi
          OUTPUT=$(pnpm exec release-it $INCREMENT --preRelease=alpha --release-version --ci --npm.skipChecks --no-git.requireCleanWorkingDir)
          NEXT=$(echo "$OUTPUT" | tail -1)
          if [[ ! "$NEXT" =~ ^[0-9]+\. ]]; then echo "::error::Cannot compute the next version: '$NEXT'"; exit 1; fi
          if [[ ! "$NEXT" =~ ^8\.0\.0-alpha\. ]]; then echo "::error::Next version $NEXT is not a v8 alpha: this workflow releases only 8.0.0-alpha.N"; exit 1; fi
          echo "Releasing $NEXT"
          echo "increment=$INCREMENT" >> "$GITHUB_OUTPUT"
      - name: Pre-Release
        run: pnpm exec release-it ${{ steps.version.outputs.increment }} --preRelease=alpha --github.release --github.preRelease --github.makeLatest=false --ci --npm.skipChecks --no-git.requireCleanWorkingDir --npm.tag=next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
