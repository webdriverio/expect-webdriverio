name: Manual NPM Publish

# v8 alphas only, until the v8.0.0 release (#2246). v7.x releases come from the v7 branch.
on:
  workflow_dispatch:

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  authorize:
    name: Authorize Actor
    uses: ./.github/workflows/authorize-publisher.yml
    secrets:
      WDIO_BOT_GITHUB_TOKEN: ${{ secrets.WDIO_BOT_GITHUB_TOKEN }}
  release:
    needs: [authorize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 'main'
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Git Setup
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: npm ci --force
      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production
      - name: Pick Version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # From a stable version (7.0.0) start 8.0.0-alpha.0, else bump the alpha
          if [[ "$CURRENT" == *-* ]]; then INCREMENT=""; else INCREMENT="major"; fi
          NEXT=$(npx release-it $INCREMENT --preRelease=alpha --release-version --ci --npm.skipChecks --no-git.requireCleanWorkingDir | tail -1)
          if [ "${NEXT%%.*}" -lt 8 ]; then echo "::error::Next version $NEXT is lower than 8: release v7.x from the v7 branch"; exit 1; fi
          echo "Releasing $NEXT"
          echo "increment=$INCREMENT" >> "$GITHUB_OUTPUT"
      - name: Pre-Release
        run: npx release-it ${{ steps.version.outputs.increment }} --preRelease=alpha --github.release --github.preRelease --github.makeLatest=false --ci --npm.skipChecks --no-git.requireCleanWorkingDir --npm.tag=next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
