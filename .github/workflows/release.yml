name: Manual NPM Publish (v7)

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release type - patch or minor (v7 is a maintenance branch: no major)"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
      preRelease:
        description: If latest release was a pre-release (e.g. X.X.X-alpha.0) and you want to push another one, pick "yes"
        required: true
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"

# v7 is a maintenance branch: it keeps `latest` only until v8.0.0 is released.
env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  authorize:
    name: Authorize Actor
    uses: ./.github/workflows/authorize-publisher.yml
    secrets:
      WDIO_BOT_GITHUB_TOKEN: ${{ secrets.WDIO_BOT_GITHUB_TOKEN }}
  release:
    needs: [authorize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 'v7'
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Git Setup
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: npm ci --force
      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production
      - name: Pick Dist-Tag
        id: tag
        run: |
          BRANCH_MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          LATEST_MAJOR=$(npm view expect-webdriverio dist-tags.latest | cut -d. -f1)
          if [ "$LATEST_MAJOR" -gt "$BRANCH_MAJOR" ]; then TAG="v${BRANCH_MAJOR}-latest"; else TAG=latest; fi
          echo "Publishing on $TAG (npm latest is v$LATEST_MAJOR)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Release
        run: npx release-it ${{github.event.inputs.releaseType}} --github.release --ci --npm.skipChecks --no-git.requireCleanWorkingDir --npm.tag=${{ steps.tag.outputs.tag }} --github.makeLatest=${{ steps.tag.outputs.tag == 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event.inputs.preRelease == 'no' }}
      - name: Pre-Release
        run: npx release-it --github.release --ci --npm.skipChecks --no-git.requireCleanWorkingDir --preRelease=alpha --github.preRelease --npm.tag=v7-next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event.inputs.preRelease == 'yes' }}
