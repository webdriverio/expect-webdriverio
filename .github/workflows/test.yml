# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # the Auto-merge workflow starts it after a Dependabot merge

concurrency:
  # Cancel superseded PR runs only; push runs never cancel each other, even when queued
  # for the same commit (event type is part of the group key).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["24.22.1"]') || fromJSON('["22.23.4", "24.22.1", "26.12.1"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run All Checks
        run: pnpm run checks:all
