name: E2e Tests

on:
  push:
    branches:
      - main
  # Uncomment the following line to run e2e tests on PRs
  pull_request:
  workflow_dispatch: # Allows manual trigger from the GitHub UI or CLI

concurrency:
  # Cancel superseded runs within the same PR, but never cancel push/workflow_dispatch
  # runs (e.g. main) against each other, so the main pipeline always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1. Run typecheck and lint across all workspaces on Linux
  playgrounds-tsc-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci && npm ci --prefix playgrounds

      - name: Run Typecheck and Lint
        run: npm run typecheck && npm run lint
        working-directory: playgrounds

  # 2. Run e2e tests for each workspace in parallel
  playgrounds-e2e-tests:
    needs: playgrounds-tsc-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [jasmine, jest, multi-remote-mocha, browser-runner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci && npm ci --prefix playgrounds

      - name: Run ${{ matrix.workspace }} E2e Tests
        run: npm --workspace=${{ matrix.workspace }} test
        working-directory: playgrounds

  # 3. Run e2e tests hacving snapshots differently!
  playgrounds-e2e-tests-with-snapshots:
    needs: playgrounds-tsc-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [mocha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci && npm ci --prefix playgrounds

      - name: Update & Run Snapshots Tests
        run: npm run playgrounds:snapshots:update

      - name: Run ${{ matrix.workspace }} E2e Tests (without snapshot tests)
        run: npm --workspace=${{ matrix.workspace }} test -- --exclude test/specs/*snapshot.test.ts
        working-directory: playgrounds
