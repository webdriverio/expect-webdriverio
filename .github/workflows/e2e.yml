name: E2e Tests

on:
  push:
    branches:
      - main
  # Uncomment the following line to run e2e tests on PRs
  pull_request:
  workflow_dispatch: # Allows manual trigger from the GitHub UI or CLI

concurrency:
  # Cancel superseded PR runs only. workflow_dispatch is keyed by run_id (always unique)
  # so manual runs never dedupe against each other or against push.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1. Run typecheck and lint across all workspaces on Linux
  playgrounds-tsc-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile && pnpm --dir playgrounds install --frozen-lockfile

      - name: Run Typecheck and Lint
        run: pnpm run typecheck && pnpm run lint
        working-directory: playgrounds

  # 2. Run e2e tests for each workspace in parallel
  playgrounds-e2e-tests:
    name: playgrounds-e2e-tests (${{ matrix.name }})
    needs: playgrounds-tsc-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: jasmine, workspace: jasmine, script: test }
          - { name: jest, workspace: jest, script: test }
          # The multi-remote specs are in the `mocha` playground
          - { name: multi-remote-mocha, workspace: mocha, script: 'test:multi-remote' }
          - { name: browser-runner, workspace: browser-runner, script: test }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile && pnpm --dir playgrounds install --frozen-lockfile

      - name: Run ${{ matrix.name }} E2e Tests
        run: pnpm --filter ./${{ matrix.workspace }} run ${{ matrix.script }}
        working-directory: playgrounds

      - name: Upload Visual Snapshots
        # The baseline, actual and diff images explain a visual snapshot failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots-linux-${{ matrix.name }}
          path: playgrounds/${{ matrix.workspace }}/visual-snapshot/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # 3. Run e2e tests hacving snapshots differently!
  playgrounds-e2e-tests-with-snapshots:
    needs: playgrounds-tsc-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [mocha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile && pnpm --dir playgrounds install --frozen-lockfile

      - name: Update & Run Snapshots Tests
        run: pnpm run playgrounds:snapshots:update

      - name: Run ${{ matrix.workspace }} E2e Tests (without snapshot tests)
        run: pnpm --filter ./${{ matrix.workspace }} test --exclude 'test/specs/*snapshot.test.ts'
        working-directory: playgrounds

      - name: Upload Visual Snapshots
        # The baseline, actual and diff images explain a visual snapshot failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots-linux-${{ matrix.workspace }}
          path: playgrounds/${{ matrix.workspace }}/visual-snapshot/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # 4. Run the multi-remote e2e tests on Windows: they have different inline snapshots in one
  #    file, and on Windows the stack frames differ (`\` paths, `file:///` URLs). See #2292.
  playgrounds-e2e-tests-windows:
    name: playgrounds-e2e-tests-windows (${{ matrix.name }})
    needs: playgrounds-tsc-and-lint
    runs-on: windows-latest
    env:
      # the root `compile:check` script, run when the playgrounds install, uses POSIX shell syntax
      pnpm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    strategy:
      matrix:
        include:
          - { name: multi-remote-mocha, workspace: mocha, script: 'test:multi-remote' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile && pnpm --dir playgrounds install --frozen-lockfile

      - name: Run ${{ matrix.name }} E2e Tests
        run: pnpm --filter ./${{ matrix.workspace }} run ${{ matrix.script }}
        working-directory: playgrounds

      - name: Upload Visual Snapshots
        # The baseline, actual and diff images explain a visual snapshot failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots-windows-${{ matrix.name }}
          path: playgrounds/${{ matrix.workspace }}/visual-snapshot/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
