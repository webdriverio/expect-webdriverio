name: E2e Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Allows manual trigger from the GitHub UI or CLI

jobs:
  # 1. Run typecheck and lint across all workspaces on Linux
  playgrounds-tsc-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci && npm ci --prefix playgrounds

      - name: Run Typecheck and Lint
        run: npm run typecheck && npm run lint
        working-directory: playgrounds

  # 2. Run multi-remote tests for each workspace in parallel
  playgrounds-e2e-tests:
    needs: playgrounds-tsc-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [jasmine, jest, mocha]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci && npm ci --prefix playgrounds

      - name: Run Workspace Tests (${{ matrix.workspace }})
        run: npm --workspace=${{ matrix.workspace }} test
        working-directory: playgrounds

  # 3. Run multi-remote on macos since linux has a hard time
  playgrounds-e2e-tests-multi-remote:
    needs: playgrounds-tsc-and-lint
    runs-on: macos-latest
    strategy:
      matrix:
        workspace: [multi-remote-mocha]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci && npm ci --prefix playgrounds

      - name: Run Workspace Tests (${{ matrix.workspace }})
        run: npm --workspace=${{ matrix.workspace }} test
        working-directory: playgrounds
