version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 10
  versioning-strategy: increase-if-necessary
  ignore:
    # The tests use `jasmineRequire.core()`, which Jasmine 7 removed, and
    # @wdio/jasmine-framework is on Jasmine 6. Update with the framework.
    - dependency-name: "jasmine-core"
      update-types: ["version-update:semver-major"]
    - dependency-name: "@types/jasmine"
      update-types: ["version-update:semver-major"]
    # Keep the Node.js types at 24, not the newest major.
    - dependency-name: "@types/node"
      update-types: ["version-update:semver-major"]
  # A dependency goes in the first group that matches. Packages released
  # together update in one PR, and each other major update gets its own PR, so
  # one breaking major does not hold back the others.
  groups:
    webdriverio:
      patterns: ["@wdio/*", "webdriver", "webdriverio"]
    jest:
      patterns: ["expect", "jest-matcher-utils", "@jest/*", "@types/jest"]
    vitest:
      patterns: ["vitest", "@vitest/*"]
    jasmine:
      patterns: ["jasmine-core", "@types/jasmine"]
    patch-deps-updates:
      update-types:
        - "patch"
    minor-deps-updates:
      update-types:
        - "minor"
# v7 maintenance branch: patch updates only
- package-ecosystem: npm
  directory: "/"
  target-branch: v7
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 5
  versioning-strategy: increase-if-necessary
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # 1.6.28 needs TypeScript 6; v7 stays on TypeScript 5.9 (typescript-eslint supports < 6.1)
    - dependency-name: "@vitest/eslint-plugin"
      versions: [">=1.6.28"]
  groups:
    patch-deps-updates:
      update-types:
        - "patch"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 10
  groups:
    patch-deps-updates:
      update-types:
        - "patch"
    minor-deps-updates:
      update-types:
        - "minor"
    major-deps-updates:
      update-types:
        - "major"
